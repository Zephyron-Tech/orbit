services:
  postgres:
    image: postgres:17-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - orbit-pgdata:/var/lib/postgresql/data
    # Loopback-only: reachable from the VPS host itself (e.g. `psql` or an SSH
    # tunnel for scripts/prod-db-tunnel.sh), never from the public internet.
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations and seeds, then exits. The api service waits for it.
  migrate:
    image: ghcr.io/zephyron-tech/orbit-api-migrate:latest
    container_name: orbit-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    image: ghcr.io/zephyron-tech/orbit-api:latest
    container_name: orbit-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      INGESTION_SECRET: ${INGESTION_SECRET:?INGESTION_SECRET is required}
      FUEL_INGESTION_SECRET: ${FUEL_INGESTION_SECRET:?FUEL_INGESTION_SECRET is required}
      BANK_STATEMENT_INGESTION_SECRET: ${BANK_STATEMENT_INGESTION_SECRET:?BANK_STATEMENT_INGESTION_SECRET is required}
      MONETA_SYNC_INGESTION_SECRET: ${MONETA_SYNC_INGESTION_SECRET:?MONETA_SYNC_INGESTION_SECRET is required}
      TRADING212_API_KEY_ID: ${TRADING212_API_KEY_ID:-}
      TRADING212_API_SECRET: ${TRADING212_API_SECRET:-}
      TRADING212_API_BASE_URL: ${TRADING212_API_BASE_URL:-https://live.trading212.com}
      REPORTING_CURRENCY: ${REPORTING_CURRENCY:-CZK}
      WEB_ORIGIN: https://orbit.zephyron.tech
      PORT: '4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
      - web_proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web_proxy'
      - 'traefik.http.routers.orbit-api.rule=Host(`api.orbit.zephyron.tech`)'
      - 'traefik.http.routers.orbit-api.entrypoints=websecure'
      - 'traefik.http.routers.orbit-api.tls.certresolver=myresolver'
      - 'traefik.http.services.orbit-api.loadbalancer.server.port=4000'

  web:
    # NEXT_PUBLIC_API_URL is baked into this image at build time (it has to
    # be — Next.js inlines NEXT_PUBLIC_* into the client bundle), pointed at
    # https://api.orbit.zephyron.tech. No runtime env var needed for it here.
    image: ghcr.io/zephyron-tech/orbit-web:latest
    container_name: orbit-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - default
      - web_proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web_proxy'
      - 'traefik.http.routers.orbit-web.rule=Host(`orbit.zephyron.tech`)'
      - 'traefik.http.routers.orbit-web.entrypoints=websecure'
      - 'traefik.http.routers.orbit-web.tls.certresolver=myresolver'
      - 'traefik.http.services.orbit-web.loadbalancer.server.port=3000'

  # Calls the Trading 212 sync every hour. A sleep loop rather than a cron
  # daemon: one dependency-free image, and the interval is the whole config.
  cron:
    image: curlimages/curl:8.11.0
    container_name: orbit-cron
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$INGESTION_SECRET" http://api:4000/cron/sync-trading212 \
            || echo "trading212 sync failed"
          curl -fsS -X POST -H "Authorization: Bearer $$INGESTION_SECRET" http://api:4000/cron/net-worth-snapshot \
            || echo "net worth snapshot failed"
          sleep 3600
        done
    environment:
      INGESTION_SECRET: ${INGESTION_SECRET:?INGESTION_SECRET is required}
    depends_on:
      api:
        condition: service_healthy

  # Nightly pg_dump, kept 30 days. A host bind mount (not the named pgdata
  # volume) so scripts/backup/pull-from-vps.sh has a plain directory to rsync
  # off the VPS from another machine.
  backup:
    image: postgres:17-alpine
    container_name: orbit-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      # All three optional: unset means "notify step skipped", never "backup fails".
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      ORBIT_DISCORD_CHANNEL_ID: ${ORBIT_DISCORD_CHANNEL_ID:-}
      ORBIT_BACKUP_KUMA_URL: ${ORBIT_BACKUP_KUMA_URL:-}
    volumes:
      - ./backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        notify_discord_success() {
          file="$$1"; size_h="$$2"; duration="$$3"
          [ -n "$$DISCORD_BOT_TOKEN" ] && [ -n "$$ORBIT_DISCORD_CHANNEL_ID" ] || return 0
          ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$$(printf '{"embeds":[{"author":{"name":"🖥️ Orbit VPS"},"title":"✅ Backup saved","description":"`%s`","color":3066993,"fields":[{"name":"Size","value":"%s","inline":true},{"name":"Duration","value":"%s","inline":true}],"footer":{"text":"Orbit backups · VPS"},"timestamp":"%s"}]}' "$$file" "$$size_h" "$$duration" "$$ts")
          wget -qO- \
            --header="Content-Type: application/json" \
            --header="Authorization: Bot $$DISCORD_BOT_TOKEN" \
            --post-data="$$payload" \
            "https://discord.com/api/v10/channels/$$ORBIT_DISCORD_CHANNEL_ID/messages" >/dev/null 2>&1 \
            || echo "discord notify failed"
        }
        notify_discord_failure() {
          stamp="$$1"
          [ -n "$$DISCORD_BOT_TOKEN" ] && [ -n "$$ORBIT_DISCORD_CHANNEL_ID" ] || return 0
          ts=$$(date -u +%Y-%m-%dT%H:%M:%SZ)
          payload=$$(printf '{"embeds":[{"author":{"name":"🖥️ Orbit VPS"},"title":"❌ Backup failed","description":"pg_dump failed at %s — check `docker logs orbit-backup`.","color":15158332,"footer":{"text":"Orbit backups · VPS"},"timestamp":"%s"}]}' "$$stamp" "$$ts")
          wget -qO- \
            --header="Content-Type: application/json" \
            --header="Authorization: Bot $$DISCORD_BOT_TOKEN" \
            --post-data="$$payload" \
            "https://discord.com/api/v10/channels/$$ORBIT_DISCORD_CHANNEL_ID/messages" >/dev/null 2>&1 \
            || echo "discord notify failed"
        }
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          start=$$(date +%s)
          if pg_dump -Fc -f "/backups/orbit-$$stamp.dump"; then
            duration="$$(( $$(date +%s) - start ))s"
            bytes=$$(wc -c < "/backups/orbit-$$stamp.dump" | tr -d ' ')
            size_h=$$(awk -v b="$$bytes" 'BEGIN{printf "%.1f MB", b/1048576}')
            echo "backup ok: orbit-$$stamp.dump"
            notify_discord_success "orbit-$$stamp.dump" "$$size_h" "$$duration"
          else
            echo "backup FAILED at $$stamp"
            notify_discord_failure "$$stamp"
          fi
          find /backups -name 'orbit-*.dump' -mtime +30 -delete
          # Unconditional: proves the loop iteration ran at all, independent of
          # whether pg_dump succeeded (mirrors mac-automation's heartbeat convention).
          [ -n "$$ORBIT_BACKUP_KUMA_URL" ] && wget -qO- "$$ORBIT_BACKUP_KUMA_URL" >/dev/null 2>&1
          sleep 86400
        done
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  orbit-pgdata:

networks:
  web_proxy:
    external: true

name: Deploy (dev)

on:
  push:
    branches: [dev]

env:
  APP_IMAGE: ghcr.io/zephyron-tech/orbit-app
  MIGRATE_IMAGE: ghcr.io/zephyron-tech/orbit-migrate
  PROJECT_DIR: /opt/docker/orbit-dev

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runner
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:dev
            ${{ env.APP_IMAGE }}:dev-${{ github.sha }}

      - name: Build and push migrate image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: migrator
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:dev
            ${{ env.MIGRATE_IMAGE }}:dev-${{ github.sha }}

      # Same auto-provisioning pattern as the prod workflow.
      - name: Ensure project directory exists on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            sudo mkdir -p ${{ env.PROJECT_DIR }}
            sudo chown "$(whoami):$(whoami)" ${{ env.PROJECT_DIR }}

      - name: Copy docker-compose.dev.yml to server
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: 'docker-compose.dev.yml'
          target: ${{ env.PROJECT_DIR }}
          strip_components: 0

      - name: Rename compose file on server
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            mv ${{ env.PROJECT_DIR }}/docker-compose.dev.yml ${{ env.PROJECT_DIR }}/docker-compose.yml

      # POSTGRES_USER/PASSWORD reused from prod secrets (same physical postgres
      # instance, dev only points at a different database name). AUTH/INGESTION
      # secrets are dev-only so dev sessions/cron auth never validate against prod.
      - name: Write .env on server
        uses: appleboy/ssh-action@v1.2.5
        env:
          POSTGRES_USER: ${{ secrets.ORBIT_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.ORBIT_POSTGRES_PASSWORD }}
          DEV_AUTH_SECRET: ${{ secrets.DEV_AUTH_SECRET }}
          DEV_INGESTION_SECRET: ${{ secrets.DEV_INGESTION_SECRET }}
          DEV_FUEL_INGESTION_SECRET: ${{ secrets.DEV_FUEL_INGESTION_SECRET }}
          TRADING212_API_KEY_ID: ${{ secrets.ORBIT_TRADING212_API_KEY_ID }}
          TRADING212_API_SECRET: ${{ secrets.ORBIT_TRADING212_API_SECRET }}
          TRADING212_API_BASE_URL: ${{ vars.ORBIT_TRADING212_API_BASE_URL }}
          REPORTING_CURRENCY: ${{ vars.ORBIT_REPORTING_CURRENCY }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: POSTGRES_USER,POSTGRES_PASSWORD,DEV_AUTH_SECRET,DEV_INGESTION_SECRET,DEV_FUEL_INGESTION_SECRET,TRADING212_API_KEY_ID,TRADING212_API_SECRET,TRADING212_API_BASE_URL,REPORTING_CURRENCY
          script: |
            umask 077
            cat > "${{ env.PROJECT_DIR }}/.env" <<EOF
            POSTGRES_USER=$POSTGRES_USER
            POSTGRES_PASSWORD=$POSTGRES_PASSWORD
            DEV_AUTH_SECRET=$DEV_AUTH_SECRET
            DEV_INGESTION_SECRET=$DEV_INGESTION_SECRET
            DEV_FUEL_INGESTION_SECRET=$DEV_FUEL_INGESTION_SECRET
            TRADING212_API_KEY_ID=$TRADING212_API_KEY_ID
            TRADING212_API_SECRET=$TRADING212_API_SECRET
            TRADING212_API_BASE_URL=$TRADING212_API_BASE_URL
            REPORTING_CURRENCY=$REPORTING_CURRENCY
            EOF
            chmod 600 "${{ env.PROJECT_DIR }}/.env"

      # This is the "turn on": pushing to dev brings the stack up (or
      # recreates it if already running). Turning it off again is manual —
      # see scripts/dev-env-down.sh — so it doesn't sit idle burning RAM.
      - name: Pull and restart
        uses: appleboy/ssh-action@v1.2.5
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            cd ${{ env.PROJECT_DIR }}
            docker compose pull
            docker compose up -d --force-recreate --remove-orphans
            docker logout ghcr.io
            # Every pull leaves the previous image digest dangling — prune only
            # dangling images, never touching anything still tagged or in use
            # (safe alongside the other compose project running on this host).
            docker image prune -f

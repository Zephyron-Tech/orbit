services:
  postgres:
    image: postgres:17-alpine
    container_name: orbit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orbit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit}
      POSTGRES_DB: ${POSTGRES_DB:-orbit}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - orbit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-orbit} -d ${POSTGRES_DB:-orbit}']
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: applies migrations and seeds, then exits. The api service waits for it.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: migrator
    container_name: orbit-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit}@postgres:5432/${POSTGRES_DB:-orbit}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runner
    container_name: orbit-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-orbit}:${POSTGRES_PASSWORD:-orbit}@postgres:5432/${POSTGRES_DB:-orbit}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required}
      INGESTION_SECRET: ${INGESTION_SECRET:?INGESTION_SECRET is required}
      FUEL_INGESTION_SECRET: ${FUEL_INGESTION_SECRET:?FUEL_INGESTION_SECRET is required}
      BANK_STATEMENT_INGESTION_SECRET: ${BANK_STATEMENT_INGESTION_SECRET:?BANK_STATEMENT_INGESTION_SECRET is required}
      MONETA_SYNC_INGESTION_SECRET: ${MONETA_SYNC_INGESTION_SECRET:?MONETA_SYNC_INGESTION_SECRET is required}
      TRADING212_API_KEY_ID: ${TRADING212_API_KEY_ID:-}
      TRADING212_API_SECRET: ${TRADING212_API_SECRET:-}
      TRADING212_API_BASE_URL: ${TRADING212_API_BASE_URL:-https://live.trading212.com}
      REPORTING_CURRENCY: ${REPORTING_CURRENCY:-CZK}
      # The browser origin CORS must allow credentialed requests from.
      WEB_ORIGIN: http://localhost:${WEB_PORT:-3000}
      PORT: '4000'
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:4000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
      # NEXT_PUBLIC_* is inlined into the client bundle at build time, so it
      # has to be a build arg, not a runtime environment variable.
      args:
        NEXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4000}
    container_name: orbit-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Calls the Trading 212 sync every hour. A sleep loop rather than a cron
  # daemon: one dependency-free image, and the interval is the whole config.
  cron:
    image: curlimages/curl:8.11.0
    container_name: orbit-cron
    restart: unless-stopped
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          curl -fsS -X POST -H "Authorization: Bearer $$INGESTION_SECRET" http://api:4000/cron/sync-trading212 \
            || echo "trading212 sync failed"
          curl -fsS -X POST -H "Authorization: Bearer $$INGESTION_SECRET" http://api:4000/cron/net-worth-snapshot \
            || echo "net worth snapshot failed"
          curl -fsS -X POST -H "Authorization: Bearer $$INGESTION_SECRET" http://api:4000/cron/notifications \
            || echo "notifications check failed"
          sleep 3600
        done
    environment:
      INGESTION_SECRET: ${INGESTION_SECRET:?INGESTION_SECRET is required}
    depends_on:
      api:
        condition: service_healthy

volumes:
  orbit-pgdata:

services:
  # No separate postgres here on purpose — shares the prod orbit-postgres
  # container via orbit-net, connecting to a second database (orbit_dev).
  # No cron service either — Trading212 sync / net-worth snapshot aren't
  # part of what a dev deploy is for.
  migrate-dev:
    image: ghcr.io/zephyron-tech/orbit-migrate:dev
    container_name: orbit-migrate-dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orbit_dev?schema=public
    networks:
      - orbit-net
    restart: 'no'

  app-dev:
    image: ghcr.io/zephyron-tech/orbit-app:dev
    container_name: orbit-app-dev
    restart: 'no'
    mem_limit: 512m
    cpus: 0.5
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/orbit_dev?schema=public
      AUTH_SECRET: ${DEV_AUTH_SECRET:?DEV_AUTH_SECRET is required}
      AUTH_TRUST_HOST: 'true'
      INGESTION_SECRET: ${DEV_INGESTION_SECRET:?DEV_INGESTION_SECRET is required}
      TRADING212_API_KEY_ID: ${TRADING212_API_KEY_ID:-}
      TRADING212_API_SECRET: ${TRADING212_API_SECRET:-}
      TRADING212_API_BASE_URL: ${TRADING212_API_BASE_URL:-https://live.trading212.com}
      REPORTING_CURRENCY: ${REPORTING_CURRENCY:-CZK}
    depends_on:
      migrate-dev:
        condition: service_completed_successfully
    networks:
      - orbit-net
      - web_proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=web_proxy'
      - 'traefik.http.routers.orbit-dev.rule=Host(`dev.orbit.zephyron.tech`)'
      - 'traefik.http.routers.orbit-dev.entrypoints=websecure'
      - 'traefik.http.routers.orbit-dev.tls.certresolver=myresolver'
      - 'traefik.http.services.orbit-dev.loadbalancer.server.port=3000'

networks:
  orbit-net:
    external: true
    name: orbit-net
  web_proxy:
    external: true
